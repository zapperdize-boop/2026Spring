<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KU-NNECT | 고려대 정보 허브</title>
    <style>
        :root { --deep-crimson: #8B0029; --sidebar-bg: #1a1a1a; --text-gray: #b0b0b0; }
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8f9fa; }

        /* 사이드바 스타일 보완 */
        nav { width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; padding: 30px 20px; }
        nav h1 { color: var(--deep-crimson); font-size: 1.5rem; margin-bottom: 40px; }
        .menu-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; color: var(--text-gray); transition: 0.3s; }
        .menu-item:hover { background: #333; color: white; }
        .menu-item.active { background: var(--deep-crimson); color: white; }

        /* [수정] 퀵 링크 섹션 디자인 강화 */
        .quick-links { margin-top: 20px; padding-top: 20px; border-top: 1px solid #333; overflow-y: auto; }
        .quick-links h3 { font-size: 0.75rem; color: #555; margin-bottom: 12px; padding-left: 10px; letter-spacing: 1px; }
        .link-item { display: block; padding: 10px; color: var(--text-gray); text-decoration: none; font-size: 0.8rem; border-radius: 5px; transition: 0.2s; }
        .link-item:hover { background: #222; color: var(--deep-crimson); }

        /* 메인 콘텐츠 구역 */
        main { flex: 1; overflow-y: auto; padding: 40px; }
        .source-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; flex-wrap: wrap; }
        .source-tab { padding: 8px 16px; border-radius: 20px; background: #eee; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #666; transition: 0.2s; }
        .source-tab.active { background: var(--deep-crimson); color: white; }

        .search-bar { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 30px; margin-bottom: 30px; font-size: 1rem; outline: none; }
        .search-bar:focus { border-color: var(--deep-crimson); }

        /* 공지 카드 스타일 */
        .notice-card { background: white; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid var(--deep-crimson); box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .source-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        .src-total { background: #e3f2fd; color: #1976d2; } 
        .src-liberal { background: #f3e5f5; color: #7b1fa2; } 
        .src-eng { background: #fff3e0; color: #ef6c00; } 
        .src-kupid { background: #eceff1; color: #455a64; }

        .d-day-badge { background: #ffeded; color: #ff4d4d; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-left: 10px; }
        .event-period { color: #888; font-size: 0.8rem; text-align: right; }
        .card-content { display: none; padding: 25px; border-top: 1px solid #f0f0f0; color: #444; white-space: pre-wrap; line-height: 1.8; background: #fafafa; }
        .notice-card.expanded .card-content { display: block; }
    </style>
</head>
<body>

<nav>
    <h1>KU-NNECT</h1>
    <div class="menu-item active" onclick="filterData('전체', this)">전체 공지</div>
    <div class="menu-item" onclick="filterData('제휴 업체', this)">제휴 업체</div>
    <div class="menu-item" onclick="filterData('이벤트/행사', this)">이벤트/행사</div>
    <div class="menu-item" onclick="filterData('멘토링/학업', this)">멘토링/학업</div>
    <div class="menu-item" onclick="filterData('학생회 소식', this)">학생회 소식</div>
    
    <!-- [추가] 고대생 필수 퀵 링크 세트 -->
    <div class="quick-links">
        <h3>KU ESSENTIALS</h3>
        <a href="https://portal.korea.ac.kr" target="_blank" class="link-item">🏛 KUPID (고대포털)</a>
        <a href="https://klms.korea.ac.kr" target="_blank" class="link-item">💻 KU LMS (블랙보드)</a>
        <a href="https://sugang.korea.ac.kr" target="_blank" class="link-item">🖱 수강신청 시스템</a>
        <a href="https://registrar.korea.ac.kr/registrar/index.do" target="_blank" class="link-item">📅 학사일정/공지사항</a>
        <a href="https://job.korea.ac.kr" target="_blank" class="link-item">💼 경력개발센터 (취업)</a>
        <a href="https://korea.ac.kr/user/boardList.do?boardId=474&siteId=university" target="_blank" class="link-item">💰 장학금 공지게시판</a>
    </div>

    <a href="admin.html" style="margin-top:auto; color:#555; text-decoration:none; font-size:0.8rem; padding-left: 10px;">⚙️ 관리자 모드</a>
</nav>

<main>
    <!-- 상단 출처별 탭 -->
    <div class="source-tabs">
        <div class="source-tab active" onclick="filterBySource('전체', this)">#전체</div>
        <div class="source-tab" onclick="filterBySource('총학생회', this)">#총학생회</div>
        <div class="source-tab" onclick="filterBySource('문과대학', this)">#문과대학</div>
        <div class="source-tab" onclick="filterBySource('영어영문학과', this)">#영어영문학과</div>
        <div class="source-tab" onclick="filterBySource('고대포털', this)">#고대포털</div>
    </div>

    <input type="text" class="search-bar" id="search-input" placeholder="키워드로 공지사항 검색 (예: 리크루팅, 장학금, 휴학)" onkeyup="searchNotices()">
    <h2 id="current-category">전체 공지</h2>
    <div id="content-list"></div>
</main>

<script>
    let currentCategory = '전체';
    let currentSource = '전체';

    function getNotices() {
        const defaultNotices = [
            { 
                id: 'default-2', 
                category: '학생회 소식', 
                source: '총학생회', 
                title: '[2026 고려대학교 총학생회 임시중앙집행위원회 리크루팅]', 
                content: '총학생회와 함께할 새로운 부원을 모집합니다. 많은 참여 바랍니다.', 
                startDate: '2026-04-29', 
                endDate: '2026-05-15' 
            },
            {
                id: 'default-3',
                category: '멘토링/학업',
                source: '고대포털',
                title: '2026-여름계절수업 수강신청 공지',
                content: '여름계절수업 수강신청 및 등록 기간을 확인해 주시기 바랍니다.',
                startDate: '2026-05-10',
                endDate: '2026-05-20'
            }
        ];
        
        const saved = JSON.parse(localStorage.getItem('ku_notices')) || [];
        return [...saved, ...defaultNotices].sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
    }

    function getSourceClass(s) {
        if(s === '총학생회') return 'src-total';
        if(s === '문과대학') return 'src-liberal';
        if(s === '고대포털') return 'src-kupid';
        return 'src-eng';
    }

    function calculateDDay(date) {
        const today = new Date();
        today.setHours(0,0,0,0);
        const target = new Date(date);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return "D-Day";
        return diff > 0 ? `D-${diff}` : `종료`;
    }

    function render(data) {
        const list = document.getElementById('content-list');
        list.innerHTML = data.map(n => `
            <div class="notice-card" id="card-${n.id}">
                <div class="card-header" onclick="document.getElementById('card-${n.id}').classList.toggle('expanded')">
                    <div style="display:flex; align-items:center;">
                        <span class="source-tag ${getSourceClass(n.source)}">${n.source}</span>
                        <span style="font-weight:600; color:#333;">${n.title}</span>
                        <span class="d-day-badge">${calculateDDay(n.endDate)}</span>
                    </div>
                    <div class="event-period">
                        <div style="font-size:0.7rem; margin-bottom:3px;">행사 기간</div>
                        ${n.startDate} ~ ${n.endDate}
                    </div>
                </div>
                <div class="card-content">
                    <div style="margin-bottom:15px; color:var(--deep-crimson); font-weight:bold;">[${n.category}]</div>
                    ${n.content}
                </div>
            </div>
        `).join('');
    }

    function applyFilters() {
        let all = getNotices();
        if (currentCategory !== '전체') {
            all = all.filter(n => n.category.includes(currentCategory.split('/')[0]));
        }
        if (currentSource !== '전체') all = all.filter(n => n.source === currentSource);
        render(all);
    }

    function filterData(cat, el) {
        currentCategory = cat;
        document.getElementById('current-category').innerText = currentSource === '전체' ? cat : `${currentSource} - ${cat}`;
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        el.classList.add('active');
        applyFilters();
    }

    function filterBySource(source, el) {
        currentSource = source;
        document.getElementById('current-category').innerText = source === '전체' ? currentCategory : `${source} - ${currentCategory}`;
        document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        applyFilters();
    }

    function searchNotices() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const all = getNotices();
        const filtered = all.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
        render(filtered);
        document.getElementById('current-category').innerText = `"${query}" 검색 결과`;
    }

    window.onload = () => render(getNotices());
</script>

</body>
</html>
