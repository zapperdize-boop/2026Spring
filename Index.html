<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KU-NNECT | 고려대 정보 허브</title>
    <style>
        :root { --deep-crimson: #8B0029; --sidebar-bg: #1a1a1a; --text-gray: #b0b0b0; }
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8f9fa; }

        /* 사이드바 */
        nav { width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; padding: 30px 20px; }
        nav h1 { color: var(--deep-crimson); font-size: 1.5rem; margin-bottom: 40px; }
        .menu-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; color: var(--text-gray); transition: 0.3s; }
        .menu-item:hover { background: #333; color: white; }
        .menu-item.active { background: var(--deep-crimson); color: white; }

        /* 메인 콘텐츠 구역 */
        main { flex: 1; overflow-y: auto; padding: 40px; }
        
        /* 상단 출처별 카테고리 탭 */
        .source-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .source-tab { padding: 8px 16px; border-radius: 20px; background: #eee; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #666; transition: 0.2s; }
        .source-tab.active { background: var(--deep-crimson); color: white; }

        .search-bar { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 30px; margin-bottom: 30px; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--deep-crimson); }

        /* 공지 카드 스타일 */
        .notice-card { background: white; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--deep-crimson); box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .source-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        .src-total { background: #e3f2fd; color: #1976d2; } 
        .src-liberal { background: #f3e5f5; color: #7b1fa2; } 
        .src-eng { background: #fff3e0; color: #ef6c00; } 
        
        .card-content { display: none; padding: 20px; border-top: 1px dashed #eee; color: #555; white-space: pre-wrap; line-height: 1.6; }
        .notice-card.expanded .card-content { display: block; }
        
        /* 행사 기간 강조 */
        .event-period { color: var(--deep-crimson); font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <h1>KU-NNECT</h1>
    <div class="menu-item active" data-type="category" onclick="filterData('전체', this)">전체 공지</div>
    <div class="menu-item" data-type="category" onclick="filterData('제휴', this)">제휴 업체</div>
    <div class="menu-item" data-type="category" onclick="filterData('이벤트', this)">이벤트/행사</div>
    <div class="menu-item" data-type="category" onclick="filterData('멘토링', this)">멘토링/학업</div>
    <div class="menu-item" data-type="category" onclick="filterData('학생회', this)">학생회 소식</div>
    <a href="admin.html" style="margin-top:auto; color:#555; text-decoration:none; font-size:0.8rem;">⚙️ 관리자 모드</a>
</nav>

<main>
    <div class="source-tabs">
        <div class="source-tab active" onclick="filterBySource('전체', this)">#전체</div>
        <div class="source-tab" onclick="filterBySource('총학생회', this)">#총학생회</div>
        <div class="source-tab" onclick="filterBySource('문과대학', this)">#문과대학</div>
        <div class="source-tab" onclick="filterBySource('영어영문학과', this)">#영어영문학과</div>
    </div>

    <input type="text" class="search-bar" id="search-input" placeholder="키워드로 공지사항 검색 (예: 리크루팅, 수요조사)" onkeyup="searchNotices()">
    <h2 id="current-category">전체 공지</h2>
    <div id="content-list"></div>
</main>

<script>
    let currentCategory = '전체';
    let currentSource = '전체';

    // 최신순(행사 시작일 기준) 정렬 로직이 포함된 데이터 로드
    function getNotices() {
        // 중복 공지 삭제 및 기본 샘플 데이터 정제
        const defaultNotices = [
            { 
                id: 'default-2', 
                category: '학생회', 
                source: '총학생회', 
                title: '[2026 고려대학교 총학생회 임시중앙집행위원회 리크루팅]', 
                content: '총학생회와 함께할 새로운 부원을 모집합니다.', 
                startDate: '2026-04-29', 
                endDate: '2026-05-10' 
            }
        ];
        
        // admin.html에서 저장한 localStorage 데이터 가져오기
        const saved = JSON.parse(localStorage.getItem('ku_notices')) || [];
        
        // 두 데이터를 합친 후, 실제 행사 시작일(startDate) 기준 최신순 정렬
        // 날짜가 더 늦은(최신인) 것이 상단에 배치됨
        return [...saved, ...defaultNotices].sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
    }

    function getSourceClass(s) {
        if(s === '총학생회') return 'src-total';
        if(s === '문과대학') return 'src-liberal';
        return 'src-eng';
    }

    function render(data) {
        const list = document.getElementById('content-list');
        list.innerHTML = data.map(n => `
            <div class="notice-card" id="card-${n.id}">
                <div class="card-header" onclick="document.getElementById('card-${n.id}').classList.toggle('expanded')">
                    <div>
                        <span class="source-tag ${getSourceClass(n.source)}">${n.source}</span>
                        <span style="font-weight:600;">${n.title}</span>
                    </div>
                    <!-- admin에서 입력한 시작일~종료일 반영 -->
                    <span class="event-period">${n.startDate} ~ ${n.endDate}</span>
                </div>
                <div class="card-content">${n.content}</div>
            </div>
        `).join('');
    }

    function applyFilters() {
        let all = getNotices();
        if (currentCategory !== '전체') all = all.filter(n => n.category === currentCategory);
        if (currentSource !== '전체') all = all.filter(n => n.source === currentSource);
        render(all);
    }

    function filterData(cat, el) {
        currentCategory = cat;
        document.getElementById('current-category').innerText = currentSource === '전체' ? cat : `${currentSource} - ${cat}`;
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        el.classList.add('active');
        applyFilters();
    }

    function filterBySource(source, el) {
        currentSource = source;
        document.getElementById('current-category').innerText = source === '전체' ? currentCategory : `${source} - ${currentCategory}`;
        document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        applyFilters();
    }

    function searchNotices() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const all = getNotices();
        const filtered = all.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
        render(filtered);
        document.getElementById('current-category').innerText = `"${query}" 검색 결과`;
    }

    window.onload = () => render(getNotices());
</script>

</body>
</html>
