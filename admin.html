<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KU-NNECT 관리자 모드</title>
    <style>
        :root { --deep-crimson: #8B0029; --bg-color: #f4f4f4; }
        body { font-family: 'Pretendard', sans-serif; padding: 40px; background: var(--bg-color); }
        .admin-box { background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; border-top: 6px solid var(--deep-crimson); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: var(--deep-crimson); display: flex; justify-content: space-between; align-items: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 0.9rem; }
        
        /* 날짜 입력을 나란히 배치하기 위한 스타일 */
        .date-group { display: flex; gap: 10px; margin-bottom: 5px; }
        .date-item { flex: 1; }
        
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 5px; }
        input[type="date"] { cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .save-btn { flex: 2; padding: 15px; background: var(--deep-crimson); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .cancel-btn { flex: 1; padding: 15px; background: #666; color: white; border: none; border-radius: 6px; cursor: pointer; display: none; }
        
        .admin-search { margin-top: 30px; padding: 10px; border: 2px solid var(--deep-crimson); border-radius: 8px; width: 100%; outline: none; }

        .data-item { background: #fff; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ddd; display: flex; flex-direction: column; gap: 5px; }
        .item-info { display: flex; justify-content: space-between; align-items: center; }
        .item-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .edit-btn { color: #2196F3; cursor: pointer; border: none; background: none; font-weight: bold; }
        .del-btn { color: #ff4d4d; cursor: pointer; border: none; background: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2 id="form-title">공지 등록 <a href="index.html" style="font-size:0.8rem; color:#666; text-decoration:none;">🏠 메인으로</a></h2>
        
        <input type="hidden" id="edit-id">

        <label>공지 출처</label>
        <select id="source">
            <option value="총학생회">총학생회</option>
            <option value="문과대학">문과대학</option>
            <option value="영어영문학과">영어영문학과</option>
        </select>

        <!-- 행사 기간 입력 (시작일 ~ 종료일) -->
        <div class="date-group">
            <div class="date-item">
                <label>행사 시작일</label>
                <input type="date" id="start-date">
            </div>
            <div class="date-item">
                <label>행사 종료일</label>
                <input type="date" id="end-date">
            </div>
        </div>

        <label>카테고리</label>
        <select id="category">
            <option value="제휴">제휴 업체</option>
            <option value="이벤트">이벤트/행사</option>
            <option value="멘토링">멘토링/학업</option>
            <option value="학생회">학생회 소식</option>
        </select>

        <label>공지 제목</label>
        <input type="text" id="title" placeholder="제목을 입력하세요">

        <label>공지 내용</label>
        <textarea id="content" rows="6" placeholder="내용을 입력하세요"></textarea>

        <div class="btn-group">
            <button class="save-btn" id="submit-btn" onclick="saveNotice()">🚀 공지 올리기</button>
            <button class="cancel-btn" id="cancel-btn" onclick="resetForm()">취소</button>
        </div>

        <hr style="margin-top:30px;">
        <h3>최근 등록 목록</h3>
        <input type="text" id="admin-search-input" class="admin-search" placeholder="관리 목록 내 검색 (제목 또는 내용)" onkeyup="showList()">
        
        <div id="manage-list"></div>
    </div>

    <script>
        function saveNotice() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const editId = document.getElementById('edit-id').value;

            if (!title || !content || !startDate || !endDate) {
                alert('제목, 내용, 시작일, 종료일을 모두 입력해주세요!');
                return;
            }

            // 시작일이 종료일보다 늦은지 검사
            if (new Date(startDate) > new Date(endDate)) {
                alert('시작일은 종료일보다 빨라야 합니다.');
                return;
            }

            const existing = JSON.parse(localStorage.getItem('ku_notices')) || [];

            if (editId) {
                const index = existing.findIndex(n => n.id == editId);
                existing[index] = {
                    ...existing[index],
                    source: document.getElementById('source').value,
                    startDate: startDate,
                    endDate: endDate,
                    category: document.getElementById('category').value,
                    title: title,
                    content: content
                };
                alert('수정이 완료되었습니다!');
            } else {
                const newNotice = {
                    id: Date.now(),
                    source: document.getElementById('source').value,
                    startDate: startDate,
                    endDate: endDate,
                    category: document.getElementById('category').value,
                    title: title,
                    content: content,
                    regDate: new Date().toLocaleDateString()
                };
                existing.unshift(newNotice);
                alert('등록 완료!');
            }

            localStorage.setItem('ku_notices', JSON.stringify(existing));
            resetForm();
            showList();
        }

        function editItem(id) {
            const notices = JSON.parse(localStorage.getItem('ku_notices')) || [];
            const target = notices.find(n => n.id == id);

            if (target) {
                document.getElementById('edit-id').value = target.id;
                document.getElementById('source').value = target.source;
                document.getElementById('start-date').value = target.startDate;
                document.getElementById('end-date').value = target.endDate;
                document.getElementById('category').value = target.category;
                document.getElementById('title').value = target.title;
                document.getElementById('content').value = target.content;

                document.getElementById('form-title').firstChild.textContent = "공지 수정 ";
                document.getElementById('submit-btn').innerText = "✅ 수정 완료";
                document.getElementById('cancel-btn').style.display = "block";
                window.scrollTo(0, 0);
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('start-date').value = "";
            document.getElementById('end-date').value = "";
            document.getElementById('title').value = "";
            document.getElementById('content').value = "";
            document.getElementById('form-title').firstChild.textContent = "공지 등록 ";
            document.getElementById('submit-btn').innerText = "🚀 공지 올리기";
            document.getElementById('cancel-btn').style.display = "none";
        }

        function showList() {
            const notices = JSON.parse(localStorage.getItem('ku_notices')) || [];
            const query = document.getElementById('admin-search-input').value.toLowerCase();
            const listDiv = document.getElementById('manage-list');
            
            const filtered = notices.filter(n => 
                n.title.toLowerCase().includes(query) || 
                n.content.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                listDiv.innerHTML = '<p style="color: #999; margin-top:10px;">검색 결과가 없습니다.</p>';
                return;
            }

            listDiv.innerHTML = filtered.map(n => `
                <div class="data-item">
                    <div class="item-info">
                        <span><strong>[${n.source}]</strong> ${n.title}</span>
                        <span style="font-size:0.75rem; color:var(--deep-crimson); font-weight:bold;">
                            ${n.startDate} ~ ${n.endDate}
                        </span>
                    </div>
                    <div class="item-btns">
                        <button class="edit-btn" onclick="editItem(${n.id})">수정</button>
                        <button class="del-btn" onclick="deleteItem(${n.id})">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteItem(id) {
            if(confirm('정말 삭제하시겠습니까?')) {
                const updated = (JSON.parse(localStorage.getItem('ku_notices')) || []).filter(n => n.id !== id);
                localStorage.setItem('ku_notices', JSON.stringify(updated));
                showList();
            }
        }

        window.onload = showList;
    </script>
</body>
</html>
